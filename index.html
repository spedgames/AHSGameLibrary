<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We've moved</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5b6472;
    --paper: #f6f7f9;
    --card: #ffffff;
    --accent: #2f6690;
    --accent-dark: #234c6c;
    --line: #e2e5ea;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 48px 40px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px rgba(20, 26, 34, 0.04), 0 12px 32px rgba(20, 26, 34, 0.06);
  }

  .pictogram {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 12px;
    object-fit: contain;
  }

  .message {
    margin: 28px 0 6px;
    font-size: 19px;
    line-height: 1.5;
    color: var(--ink);
  }

  .message .destination {
    display: block;
    margin-top: 8px;
    font-weight: 600;
    color: var(--accent-dark);
    white-space: nowrap;
    font-size: clamp(13px, 3.6vw, 17px);
  }

  .go-button {
    margin-top: 30px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .go-button:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  .go-button:focus-visible {
    outline: 3px solid var(--accent-dark);
    outline-offset: 3px;
  }

  .go-button img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef1f5;
      --muted: #a7b0bd;
      --paper: #14181d;
      --card: #1c2128;
      --line: #2b313a;
      --accent: #4d8fc2;
      --accent-dark: #6fa8d6;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <img
      class="pictogram"
      src="https://static.arasaac.org/pictograms/31847/31847_500.png"
      alt="Pictogram indicating a page has moved"
      width="140"
      height="140"
    >
    <p class="message">
      I think you are looking for
      <span class="destination">ahsresources.github.io/AHSGameLibrary</span>
    </p>
    <a
      class="go-button"
      href="https://ahsresources.github.io/AHSGameLibrary"
    >
      <img
        src="https://static.arasaac.org/pictograms/31758/31758_500.png"
        alt=""
        width="28"
        height="28"
      >
      Bring me there!
    </a>
  </main>
</body>
</html>
